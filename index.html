<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>고등학교 그래프 탐구 도구</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./vendor/math.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="graph-zone" aria-label="그래프 탐구 영역">
        <header class="top-bar">
          <div class="title-block">
            <p class="eyebrow">Graph Lab</p>
            <h1>함수 그래프 탐구</h1>
          </div>
          <div class="top-actions">
            <div class="record-pill" aria-live="polite">
              <span id="recordMode">준비</span>
              <strong id="recordTime">00:00</strong>
            </div>
            <button class="record-button" id="recordButton" type="button" aria-pressed="false" title="녹화 시작">
              <span class="record-dot" aria-hidden="true"></span>
              <span id="recordButtonText">녹화</span>
            </button>
            <button class="icon-button" id="saveImage" type="button" aria-label="그래프 이미지 저장" title="그래프 이미지 저장">
              <span aria-hidden="true">▣</span>
            </button>
            <button class="icon-button" id="resetView" type="button" aria-label="보기 초기화" title="보기 초기화">
              <span aria-hidden="true">↺</span>
            </button>
          </div>
        </header>

        <div class="canvas-wrap">
          <canvas id="graphCanvas" aria-label="함수 그래프"></canvas>
          <div class="floating-readout" id="probeReadout">
            <span class="label">선택점</span>
            <strong id="probePoint">x = 0, y = 0</strong>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="그래프 설정과 도구">
        <section class="expression-box">
          <div class="section-title">
            <label for="expression">f(x)</label>
            <div class="view-switch" role="group" aria-label="그래프 조작 방식">
              <button class="mini active" id="probeMode" type="button">점</button>
              <button class="mini" id="panMode" type="button">이동</button>
            </div>
          </div>
          <div class="input-row">
            <input id="expression" value="a*x^2 + b*x + c" autocomplete="off" spellcheck="false" />
            <button id="applyExpression" type="button">적용</button>
          </div>
          <p id="parseStatus" class="status-text">f(x) = a*x^2 + b*x + c</p>

          <label class="check-row compact-check">
            <input id="enableG" type="checkbox" />
            <span>g(x) 함께 보기</span>
          </label>
          <div class="input-row secondary-expression">
            <input id="expressionG" value="a*(x-b)^2 + c" autocomplete="off" spellcheck="false" />
            <button id="applyExpressionG" type="button">적용</button>
          </div>
          <p id="parseStatusG" class="status-text muted-line">g(x)는 선택하면 표시됩니다.</p>
        </section>

        <section class="preset-box" aria-label="함수 프리셋">
          <div class="section-title">
            <strong>프리셋</strong>
            <button id="shareLink" class="mini" type="button">공유</button>
          </div>
          <div class="preset-grid">
            <button type="button" data-preset="quadratic">이차</button>
            <button type="button" data-preset="vertex">꼭짓점</button>
            <button type="button" data-preset="linear">일차</button>
            <button type="button" data-preset="absolute">절댓값</button>
            <button type="button" data-preset="cubic">삼차</button>
            <button type="button" data-preset="rational">유리</button>
            <button type="button" data-preset="trig">삼각</button>
            <button type="button" data-preset="sqrt">루트</button>
          </div>
          <p id="shareStatus" class="status-text muted-line">현재 상태를 링크로 복사할 수 있습니다.</p>
        </section>

        <section class="slider-grid" aria-label="계수 슬라이더">
          <div class="slider-row">
            <div class="slider-label">
              <span>a</span>
              <output id="aValue">1.00</output>
            </div>
            <input id="aSlider" type="range" min="-5" max="5" step="0.05" value="1" />
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span>b</span>
              <output id="bValue">0.00</output>
            </div>
            <input id="bSlider" type="range" min="-10" max="10" step="0.1" value="0" />
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span>c</span>
              <output id="cValue">0.00</output>
            </div>
            <input id="cSlider" type="range" min="-10" max="10" step="0.1" value="0" />
          </div>
        </section>

        <section class="view-box" aria-label="좌표평면 보기 설정">
          <div class="section-title">
            <strong>보기</strong>
            <div class="button-row">
              <button class="mini" id="zoomOut" type="button">−</button>
              <button class="mini" id="zoomIn" type="button">＋</button>
            </div>
          </div>
          <div class="compact-row view-row">
            <label for="gridStep">눈금</label>
            <select id="gridStep">
              <option value="auto">자동</option>
              <option value="0.5">0.5</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="5">5</option>
            </select>
            <label for="graphColor">색</label>
            <select id="graphColor">
              <option value="#35a6ff">파랑</option>
              <option value="#6ee7b7">초록</option>
              <option value="#b892ff">보라</option>
              <option value="#ff9f1c">주황</option>
            </select>
          </div>
          <label class="check-row compact-check">
            <input id="autoFit" type="checkbox" checked />
            <span>그래프에 맞춰 자동 보기</span>
          </label>
        </section>

        <section class="info-grid" aria-label="함수 정보">
          <article>
            <span>꼭짓점</span>
            <strong id="vertexInfo">-</strong>
          </article>
          <article>
            <span>축의 방정식</span>
            <strong id="axisInfo">-</strong>
          </article>
          <article>
            <span>y절편</span>
            <strong id="interceptInfo">-</strong>
          </article>
          <article>
            <span>x절편</span>
            <strong id="xInterceptInfo">-</strong>
          </article>
        </section>

        <section class="tools" aria-label="탐구 도구">
          <div class="tool-tabs" role="tablist" aria-label="도구 선택">
            <button class="tab active" type="button" role="tab" aria-selected="true" data-tool="basic">기본</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tool="ratio">비율</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tool="tangent">접선</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tool="intersections">교점</button>
            <button class="tab" type="button" role="tab" aria-selected="false" data-tool="integral">적분</button>
          </div>

          <div class="tool-card active" id="tool-basic" role="tabpanel">
            <label class="check-row">
              <input id="showRoots" type="checkbox" checked />
              <span>x절편 표시</span>
            </label>
            <label class="check-row">
              <input id="showGuides" type="checkbox" checked />
              <span>평행 보조선 표시</span>
            </label>
            <label class="check-row">
              <input id="showSpecials" type="checkbox" checked />
              <span>특이점 표시</span>
            </label>
            <p class="tool-result" id="basicResult">f(1) = 1</p>
          </div>

          <div class="tool-card" id="tool-ratio" role="tabpanel">
            <div class="compact-row">
              <label for="x1Input">x₁</label>
              <input id="x1Input" type="number" step="0.1" value="-1" />
              <label for="x2Input">x₂</label>
              <input id="x2Input" type="number" step="0.1" value="1" />
            </div>
            <p class="tool-result" id="ratioResult">두 점의 변화량과 평균변화율을 계산합니다.</p>
          </div>

          <div class="tool-card" id="tool-tangent" role="tabpanel">
            <div class="compact-row">
              <label for="tangentX">접점 x</label>
              <input id="tangentX" type="number" step="0.1" value="0" />
              <button id="useProbeForTangent" type="button">선택점</button>
            </div>
            <p class="tool-result" id="tangentResult">접선의 방정식이 여기에 표시됩니다.</p>
          </div>

          <div class="tool-card" id="tool-intersections" role="tabpanel">
            <p class="tool-result" id="intersectionResult">g(x)를 켜면 두 그래프의 교점을 계산합니다.</p>
          </div>

          <div class="tool-card" id="tool-integral" role="tabpanel">
            <div class="compact-row">
              <label for="integralFrom">∫ from</label>
              <input id="integralFrom" type="number" step="0.1" value="-1" />
              <label for="integralTo">to</label>
              <input id="integralTo" type="number" step="0.1" value="1" />
            </div>
            <label class="check-row">
              <input id="showRiemann" type="checkbox" />
              <span>리만합 직사각형</span>
            </label>
            <p class="tool-result" id="integralResult">정적분 값을 근사 계산합니다.</p>
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>고등학교 그래프 탐구 도구</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="graph-zone" aria-label="그래프 탐구 영역">
        <header class="top-bar">
          <div>
            <p class="eyebrow">Graph Lab</p>
            <h1>함수 그래프 탐구</h1>
          </div>
          <div class="top-actions">
            <div class="record-pill" aria-live="polite">
              <span id="recordMode">준비</span>
              <strong id="recordTime">00:00</strong>
            </div>
            <button class="record-button" id="recordButton" type="button" aria-pressed="false" title="녹화 시작">
              <span class="record-dot" aria-hidden="true"></span>
              <span id="recordButtonText">녹화</span>
            </button>
            <button class="icon-button" id="resetView" type="button" aria-label="보기 초기화" title="보기 초기화">
              <span aria-hidden="true">↺</span>
            </button>
          </div>
        </header>

        <div class="canvas-wrap">
          <canvas id="graphCanvas" aria-label="함수 그래프"></canvas>
          <div class="floating-readout" id="probeReadout">
            <span class="label">선택점</span>
            <strong id="probePoint">x = 0, y = 0</strong>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="그래프 설정과 도구">
        <section class="expression-box">
          <label for="expression">식</label>
          <div class="input-row">
            <input id="expression" value="a*x^2 + b*x + c" autocomplete="off" spellcheck="false" />
            <button id="applyExpression" type="button">적용</button>
          </div>
          <p id="parseStatus" class="status-text">a*x^2 + b*x + c 형식으로 시작합니다.</p>
        </section>

        <section class="slider-grid" aria-label="계수 슬라이더">
          <div class="slider-row">
            <div class="slider-label">
              <span>a</span>
              <output id="aValue">1.00</output>
            </div>
            <input id="aSlider" type="range" min="-5" max="5" step="0.05" value="1" />
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span>b</span>
              <output id="bValue">0.00</output>
            </div>
            <input id="bSlider" type="range" min="-10" max="10" step="0.1" value="0" />
          </div>
          <div class="slider-row">
            <div class="slider-label">
              <span>c</span>
              <output id="cValue">0.00</output>
            </div>
            <input id="cSlider" type="range" min="-10" max="10" step="0.1" value="0" />
          </div>
        </section>

        <section class="info-grid" aria-label="함수 정보">
          <article>
            <span>꼭짓점</span>
            <strong id="vertexInfo">-</strong>
          </article>
          <article>
            <span>축의 방정식</span>
            <strong id="axisInfo">-</strong>
          </article>
          <article>
            <span>y절편</span>
            <strong id="interceptInfo">-</strong>
          </article>
          <article>
            <span>x절편</span>
            <strong id="xInterceptInfo">-</strong>
          </article>
        </section>

        <section class="tools" aria-label="탐구 도구">
          <div class="tool-tabs" role="tablist" aria-label="도구 선택">
            <button class="tab active" type="button" data-tool="basic">기본</button>
            <button class="tab" type="button" data-tool="ratio">비율</button>
            <button class="tab" type="button" data-tool="tangent">접선</button>
            <button class="tab" type="button" data-tool="integral">적분</button>
          </div>

          <div class="tool-card active" id="tool-basic">
            <label class="check-row">
              <input id="showRoots" type="checkbox" checked />
              <span>x절편 표시</span>
            </label>
            <label class="check-row">
              <input id="showGuides" type="checkbox" checked />
              <span>평행 보조선 표시</span>
            </label>
            <p class="tool-result" id="basicResult">그래프를 누르면 해당 점을 기준으로 보조선이 움직입니다.</p>
          </div>

          <div class="tool-card" id="tool-ratio">
            <div class="compact-row">
              <label for="x1Input">x₁</label>
              <input id="x1Input" type="number" step="0.1" value="-1" />
              <label for="x2Input">x₂</label>
              <input id="x2Input" type="number" step="0.1" value="1" />
            </div>
            <p class="tool-result" id="ratioResult">두 점의 변화량과 평균변화율을 계산합니다.</p>
          </div>

          <div class="tool-card" id="tool-tangent">
            <div class="compact-row">
              <label for="tangentX">접점 x</label>
              <input id="tangentX" type="number" step="0.1" value="0" />
              <button id="useProbeForTangent" type="button">선택점</button>
            </div>
            <p class="tool-result" id="tangentResult">접선의 방정식이 여기에 표시됩니다.</p>
          </div>

          <div class="tool-card" id="tool-integral">
            <div class="compact-row">
              <label for="integralFrom">∫ from</label>
              <input id="integralFrom" type="number" step="0.1" value="-1" />
              <label for="integralTo">to</label>
              <input id="integralTo" type="number" step="0.1" value="1" />
            </div>
            <p class="tool-result" id="integralResult">정적분 값을 근사 계산합니다.</p>
          </div>
        </section>
      </aside>
    </main>
  </body>
</html>

services:
  - type: web
    name: choblog-7-mission
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: MASTER_CODE
        sync: false
    disk:
      name: choblog-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1

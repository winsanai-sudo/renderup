<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>초블10기 마스터</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="admin">
    <main class="app-shell wide-shell">
      <nav class="topbar">
        <a class="brand" href="/">
          <span class="brand-mark">초블10</span>
          <span>
            <strong>초블10기</strong>
            <small>Master Deck</small>
          </span>
        </a>
        <div class="nav-actions">
          <a class="ghost-link" href="/">참가자</a>
          <a class="ghost-link" href="/links.html">방문 링크</a>
        </div>
      </nav>

      <section id="adminLogin" class="login-grid admin-login">
        <div class="login-copy">
          <p class="eyebrow">마스터 접속</p>
          <h1>전체 미션 현황</h1>
          <p class="lead">제출 시간, 지각 제출, 반별 성공률을 확인합니다.</p>
        </div>
        <form id="adminLoginForm" class="panel login-panel">
          <label class="field">
            <span>마스터 코드</span>
            <input id="masterCodeInput" type="password" autocomplete="current-password" />
          </label>
          <button class="primary-btn" type="submit">입장</button>
          <p id="adminLoginMessage" class="message" role="status"></p>
        </form>
      </section>

      <section id="adminView" class="admin-view hidden">
        <div class="section-heading hero-heading">
          <div>
            <p class="eyebrow">Master Dashboard</p>
            <h1>초블10기 전체 데이터</h1>
          </div>
          <button id="adminLogoutBtn" class="ghost-btn" type="button">마스터 로그아웃</button>
        </div>

        <div class="control-band">
          <div class="auto-week-status">
            <span>자동 운영 주차</span>
            <strong id="currentWeekLabel">1주차</strong>
            <small>매주 화요일 00:01 마감 점검</small>
          </div>
          <button id="refreshAuditBtn" class="ghost-btn small-btn" type="button">점검 새로고침</button>
          <button id="copyLinksBtn" class="ghost-btn small-btn" type="button">방문 링크 복사</button>
          <button id="resetBtn" class="danger-btn small-btn" type="button">초기화</button>
        </div>

        <div id="kpiGrid" class="kpi-grid"></div>

        <section class="admin-section review-section">
          <div class="section-heading review-heading">
            <div>
              <p class="eyebrow">Weekly Review</p>
              <h2>미션 보완 대상</h2>
            </div>
            <label class="field compact-field week-filter">
              <span>마감 주차</span>
              <select id="reviewWeekSelect">
                <option value="1">1주차</option>
                <option value="2">2주차</option>
                <option value="3">3주차</option>
                <option value="4">4주차</option>
                <option value="5">5주차</option>
              </select>
            </label>
          </div>
          <div id="auditStatus" class="audit-status"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>우선</th>
                  <th>팀</th>
                  <th>이름</th>
                  <th>미션1</th>
                  <th>미션2</th>
                  <th>블로그</th>
                </tr>
              </thead>
              <tbody id="failuresTable"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-section">
          <div class="section-heading">
            <h2>참가자별 반별 성공 현황</h2>
            <span id="memberCountBadge"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>그룹</th>
                  <th>이름</th>
                  <th>핸드폰</th>
                  <th>성공</th>
                  <th>1주차</th>
                  <th>2주차</th>
                  <th>3주차</th>
                  <th>4주차</th>
                  <th>5주차</th>
                </tr>
              </thead>
              <tbody id="membersTable"></tbody>
            </table>
          </div>
        </section>

        <section class="admin-section">
          <div class="section-heading">
            <h2>제출 데이터</h2>
            <span id="submissionCountBadge"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>상태</th>
                  <th>회차</th>
                  <th>미션</th>
                  <th>그룹</th>
                  <th>이름</th>
                  <th>제출 시간</th>
                  <th>제출 당시</th>
                  <th>내용</th>
                </tr>
              </thead>
              <tbody id="submissionsTable"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="/admin.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>초블{{COHORT}}기 방문 링크</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="links" data-cohort="{{COHORT}}" data-base="{{BASE}}">
    <main class="app-shell wide-shell">
      <nav class="topbar">
        <a class="brand" href="{{BASE}}">
          <span class="brand-mark">초블{{COHORT}}</span>
          <span>
            <strong>초블{{COHORT}}기</strong>
            <small>Visit Links</small>
          </span>
        </a>
        <div class="nav-actions">
          <a class="ghost-link" href="{{BASE}}">참가자</a>
          <a class="ghost-link" href="{{BASE}}admin.html">마스터</a>
        </div>
      </nav>

      <section class="section-heading hero-heading">
        <div>
          <p class="eyebrow" id="linksScopeLabel">초블{{COHORT}}기</p>
          <h1>블로그 방문 링크</h1>
        </div>
        <label class="field compact-field week-filter">
          <span>주차 선택</span>
          <select id="weekFilter">
            <option value="0">전체</option>
            <option value="1">1주차</option>
            <option value="2">2주차</option>
            <option value="3">3주차</option>
            <option value="4">4주차</option>
            <option value="5">5주차</option>
          </select>
        </label>
      </section>

      <div id="linksGrid" class="links-grid"></div>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <script src="/links.js"></script>
  </body>
</html>
